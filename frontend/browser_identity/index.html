<!doctype html><html><head><meta charset="utf-8"></head><body><script>
// This component never places the anonymous bearer token in a URL or log.
const parentOrigin = new URL(document.referrer || location.href).origin;
function send(type, fields) {
  parent.postMessage(Object.assign({isStreamlitMessage: true, type}, fields), parentOrigin);
}
send('streamlit:componentReady', {apiVersion: 1});
send('streamlit:setFrameHeight', {height: 0});
try {
  const key = 'materials-browser-identity-v1';
  let token = localStorage.getItem(key);
  if (!/^[a-f0-9]{64}$/.test(token || '')) {
    const bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);
    token = Array.from(bytes, n => n.toString(16).padStart(2, '0')).join('');
    localStorage.setItem(key, token);
  }
  send('streamlit:setComponentValue', {value: token, dataType: 'json'});
} catch (error) {
  send('streamlit:setComponentValue', {value: 'storage_unavailable', dataType: 'json'});
}
</script></body></html>
